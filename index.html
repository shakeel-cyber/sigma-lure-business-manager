<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="SIGMA LURES Business Manager">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <title>SIGMA LURES — Business Manager</title>
</head>
<body>
  <header class="topbar">
    <button id="global-header-back-btn" class="icon-btn hidden" aria-label="Go back">←</button>
    <div class="brand">
      <img src="logo.png" alt="Sigma Lures logo" onerror="this.style.display='none'">
      <div><strong>SIGMA LURES</strong><span>Business Manager</span></div>
    </div>
    <button id="header-home-btn" class="icon-btn" aria-label="Home">⌂</button>
  </header>

  <main id="app" class="app-shell">
    <section id="dashboard-view" class="view-section active"></section>
    <section id="new-order-view" class="view-section"></section>
    <section id="shops-view" class="view-section"></section>
    <section id="customers-view" class="view-section"></section>
    <section id="sales-view" class="view-section"></section>
    <section id="purchases-view" class="view-section"></section>
    <section id="dues-view" class="view-section"></section>
    <section id="planned-view" class="view-section"></section>
    <section id="catalogue-view" class="view-section"></section>
    <section id="reports-view" class="view-section"></section>
    <section id="backup-view" class="view-section"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-nav="dashboard-view">🏠<span>Home</span></button>
    <button data-nav="new-order-view">➕<span>New Order</span></button>
    <button data-nav="shops-view">🏪<span>Shops</span></button>
    <button data-nav="customers-view">👤<span>Customers</span></button>
    <button data-nav="sales-view">📊<span>Sales</span></button>
    <button data-nav="purchases-view">🛒<span>Purchases</span></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
